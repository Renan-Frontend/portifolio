name: Deploy GitHub Pages

on:
  push:
    branches:
      - feat/pagina-projetos
      - stage
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Mantém /portifolio/ vivo redirecionando para a raiz
  # (links antigos enviados no estágio continuam funcionando).
  build-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload redirect artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

  deploy-redirect:
    needs: build-redirect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy redirect
        id: deployment
        uses: actions/deploy-pages@v4
